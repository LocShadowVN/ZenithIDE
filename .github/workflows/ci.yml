name: CI - Code Quality

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
        
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Install frontend dependencies
        run: npm install

      # THÊM BƯỚC NÀY ĐỂ TẠO ICON TRƯỚC KHI CHẠY CARGO
      - name: Generate 'Z' Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024, 1024), (30, 30, 30, 255))
          draw = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('arial.ttf', 700)
          except:
              font = ImageFont.load_default()
          draw.text((180, 100), 'Z', fill=(255, 255, 255, 255), font=font)
          img.save('app-icon.png')
          "
          npm run tauri icon app-icon.png

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri
        
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
        
      - name: Run Rust tests
        run: cargo test --all
        working-directory: src-tauri

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
        
      - name: Install dependencies
        run: npm install
        
      - name: Run Svelte Check
        run: npm run check
