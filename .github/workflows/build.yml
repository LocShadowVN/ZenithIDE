name: Build Releases

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
        
      - name: Install frontend dependencies
        run: npm install

      - name: Generate 'Z' Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (1024, 1024), (30, 30, 30, 255))
          draw = ImageDraw.Draw(img)
          draw.line([(200, 200), (800, 200)], fill=(255, 255, 255, 255), width=80)
          draw.line([(800, 200), (200, 800)], fill=(255, 255, 255, 255), width=80)
          draw.line([(200, 800), (800, 800)], fill=(255, 255, 255, 255), width=80)
          img.save('app-icon.png')
          "
          npm run tauri icon app-icon.png

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # BƯỚC MA THUẬT Ở ĐÂY: Tự động cập nhật version từ Tag GitHub
      - name: Set Version from Tag
        run: |
          # Lấy tên tag/branch, cắt bỏ chữ "v" ở đầu
          RAW_VERSION=${GITHUB_REF_NAME#v}
          # Dùng grep để trích xuất đúng 3 chữ số phiên bản (vd: 0.1.0), bỏ qua ký tự thừa
          VERSION=$(echo "$RAW_VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          # Nếu không tìm thấy số phiên bản hợp lệ, gán mặc định 0.0.1 để không bị lỗi build
          if [ -z "$VERSION" ]; then VERSION="0.0.1"; fi
          
          echo "Đang set version thành: $VERSION"
          
          # Sửa file package.json và tauri.conf.json
          node -e "const fs=require('fs'); let p=JSON.parse(fs.readFileSync('package.json')); p.version='$VERSION'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          node -e "const fs=require('fs'); let p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); p.version='$VERSION'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2));"
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ZenithIDE v__VERSION__'
          releaseBody: 'Optimized build with VS Code-like UI.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
