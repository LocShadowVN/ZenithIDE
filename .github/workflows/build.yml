name: Build Releases

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
        
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # BƯỚC MỚI: TỰ ĐỘNG VẼ CHỮ Z VÀ TẠO ICON
      - name: Generate 'Z' Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024, 1024), (30, 30, 30, 255))
          draw = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('arial.ttf', 700)
          except:
              font = ImageFont.load_default()
          draw.text((180, 100), 'Z', fill=(255, 255, 255, 255), font=font)
          img.save('app-icon.png')
          "
          npx @tauri-apps/cli icon app-icon.png
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: zenithide-v__VERSION__
          releaseName: 'ZenithIDE v__VERSION__'
          releaseBody: 'Lightweight setup. Compilers can be downloaded directly inside the app.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
