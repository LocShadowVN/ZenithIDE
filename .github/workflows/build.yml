name: Build Releases

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Cấp quyền ghi để tạo Release và đẩy file cài đặt lên
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
        
      - name: Install frontend dependencies
        run: npm install

      - name: Generate 'Z' Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (1024, 1024), (30, 30, 30, 255))
          draw = ImageDraw.Draw(img)
          draw.line([(200, 200), (800, 200)], fill=(255, 255, 255, 255), width=80)
          draw.line([(800, 200), (200, 800)], fill=(255, 255, 255, 255), width=80)
          draw.line([(200, 800), (800, 800)], fill=(255, 255, 255, 255), width=80)
          img.save('app-icon.png')
          "
          npm run tauri icon app-icon.png

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Đổi tên tag cho khớp với tag bạn đẩy lên GitHub
          tagName: v__VERSION__
          releaseName: 'ZenithIDE v__VERSION__'
          releaseBody: 'Optimized build with VS Code-like UI.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
