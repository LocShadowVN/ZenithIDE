name: Generate Tauri Keys

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
        
      - name: Generate Keys
        run: |
          # Đặt mật khẩu ở đây (ví dụ: 123456)
          tauri signer generate -w ./zenith_ide.key -p "123456"
          
      - name: Print Public Key (Copy cái này dán vào tauri.conf.json)
        run: |
          echo "=========================================="
          echo "PUBLIC KEY (Dán vào tauri.conf.json):"
          echo "=========================================="
          cat ./zenith_ide.key.pub
          
      - name: Print Private Key (Copy cái này dán vào GitHub Secrets)
        run: |
          echo "=========================================="
          echo "PRIVATE KEY (Dán vào GitHub Secret TAURI_PRIVATE_KEY):"
          echo "=========================================="
          cat ./zenith_ide.key
